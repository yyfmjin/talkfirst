services:
  postgres:
    image: postgres:16-alpine
    container_name: talkfirst-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talkfirst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talkfirst}
      POSTGRES_DB: ${POSTGRES_DB:-talkfirst}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-talkfirst} -d $${POSTGRES_DB:-talkfirst}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: talkfirst-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: talkfirst-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      APP_URL: ${APP_URL:-http://localhost:3000}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-talkfirst}:${POSTGRES_PASSWORD:-talkfirst}@postgres:5432/${POSTGRES_DB:-talkfirst}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-talkfirst}:${POSTGRES_PASSWORD:-talkfirst}@postgres:5432/${POSTGRES_DB:-talkfirst}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      # SEC-005: post-registration e-mail verification enforcement.
      ENFORCE_EMAIL_VERIFICATION: ${ENFORCE_EMAIL_VERIFICATION:-false}
      # Legacy pre-registration gate (deprecated; superseded above).
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-}
      # FIX (audit P004): uploads are written to the filesystem, so the directory
      # must live on a volume. Without this, every avatar / chat image / moment
      # video was destroyed whenever the container was recreated, while the
      # database kept pointing at the dead URLs.
      UPLOAD_DIR: /app/uploads
      # The public base for stored files. Must be reachable by the BROWSER, not
      # by the container, so it stays an absolute public URL.
      PUBLIC_UPLOAD_BASE_URL: ${PUBLIC_UPLOAD_BASE_URL:-http://localhost:4000/uploads}
      # Phase O1-5 — proxy hops in front of the API. This compose file publishes
      # the API directly (`ports: 4000:4000`) and defines NO proxy service, so 0
      # is correct here. It must be stated explicitly: the code's production
      # fallback is 1, and trusting a hop that does not exist lets any caller
      # forge their own address with an X-Forwarded-For header, making every
      # `AccessLog.ip` value attacker-controlled. Raise this to the real hop count
      # (1 for a reverse proxy, 2 for a CDN plus a reverse proxy) when one is
      # added, or the API will refuse to start in production.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Google 快捷登录.
      #
      # API_PUBLIC_URL is what the OAuth `redirect_uri` is DERIVED from, and it must
      # match the value registered in the Google Cloud console character for
      # character. It is not APP_URL: APP_URL is the web origin, and deriving the
      # callback from it produces a `redirect_uri_mismatch` that says nothing about
      # the real cause. Leaving it unset falls back to `http://localhost:4000`, which
      # Google rejects outside loopback — so any deployment behind a domain must set
      # it. `assertOAuthConfiguration()` refuses to boot on a non-https value.
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
      # Both must be present for Google sign-in to be offered at all; leaving both
      # empty is a supported state (the button is simply not rendered).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH_PROVIDERS: ${OAUTH_PROVIDERS:-}
      # Must never be true here: `assertOAuthConfiguration()` refuses to boot in
      # production with the development stand-in enabled, which is the point.
      OAUTH_DEV_PROVIDER: ${OAUTH_DEV_PROVIDER:-false}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api/v1}
        NEXT_PUBLIC_SOCKET_BASE_URL: ${NEXT_PUBLIC_SOCKET_BASE_URL:-http://localhost:4000}
    container_name: talkfirst-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api/v1}
      NEXT_PUBLIC_SOCKET_BASE_URL: ${NEXT_PUBLIC_SOCKET_BASE_URL:-http://localhost:4000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api/v1}
    container_name: talkfirst-admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api/v1}
    ports:
      - "${ADMIN_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3001/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
  # FIX (audit P004): user-generated media must outlive the API container.
  uploads_data:
