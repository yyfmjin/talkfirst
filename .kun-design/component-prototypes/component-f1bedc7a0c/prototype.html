<!doctype html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' 'self'; script-src 'unsafe-inline' 'self'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'none'; frame-src 'none'; object-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="kun-component-prototype" content="1">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TalkFirst 动态 — 角色动态原型</title>
<style>
  /*
   * TalkFirst「动态」原型 —— 角色感（动漫体）动态语言
   *
   * 全部视觉值取自 apps/web/src/design/tokens.ts：
   *   brand-500 #3B82F6（首要操作/激活） accent-500 #7C6CE5（社交层：连接、反应）
   *   neutral 50/100/200/400/500/800  radius control 18 / row 20 / card 24
   *   type display 28·title 22·heading 17·body 15·ui 14·caption 12·overline 11
   *   shadow.card 极轻（靠边框分层，不靠阴影堆叠）
   *
   * 三条自我约束（来自设计体系的作品标准）：
   *   1) 不用弹性/回弹缓动 —— 角色动感靠“持续的在位微动 + 柔和的进出”，不是弹跳；
   *   2) 每个动画都有 prefers-reduced-motion 的关闭分支；
   *   3) 不用 emoji 当图标；文字对比度按 AA 选值（正文 15.4:1、次要 4.76:1）。
   */
  :root {
    --brand-50:#F5F9FF; --brand-100:#EAF3FF; --brand-300:#B3D1FE; --brand-500:#3B82F6; --brand-600:#2563EB; --brand-700:#1D4ED8;
    --accent-50:#F4F2FF; --accent-100:#EBE7FF; --accent-300:#B9AEF7; --accent-500:#7C6CE5; --accent-600:#6A58D8;
    --n0:#FFFFFF; --n25:#FBFCFE; --n50:#F7F9FC; --n100:#F1F4F9; --n200:#E9EDF4; --n300:#D8DEE9; --n400:#B4BCCC; --n500:#68738A; --n600:#4A5468; --n800:#172033;
    --success-500:#22C55E; --danger-500:#EF4444;
    --r-control:18px; --r-row:20px; --r-card:24px;
    --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Segoe UI",system-ui,sans-serif;
    --card-shadow:0 1px 2px rgba(23,32,51,.04),0 1px 3px rgba(23,32,51,.05);
    --ease-out:cubic-bezier(.22,1,.36,1);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--n50); color:var(--n800); font-family:var(--sans); }
  body { display:flex; justify-content:center; padding:24px 12px 48px; }

  /* 手机壳：与成员端一致的内容列宽（390px，最宽 430px） */
  .shell { width:100%; max-width:390px; background:var(--n50); border-radius:32px; padding:0 0 28px; }
  @media (min-width:430px){ .shell { box-shadow:0 30px 80px rgba(80,110,200,.18); } }

  /* ---------------- 顶部 ---------------- */
  header { padding:20px 20px 0; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  h1 { margin:0; font-size:22px; line-height:30px; letter-spacing:-.01em; font-weight:600; }
  .icon-btn { width:44px; height:44px; border:0; background:transparent; border-radius:var(--r-control); display:grid; place-items:center; cursor:pointer; transition:background .12s var(--ease-out); }
  .icon-btn:hover { background:var(--n100); }
  .icon-btn:focus-visible { outline:2px solid var(--brand-500); outline-offset:2px; }

  /* 分段：动态 / 收藏（真实页面里的两个标签） */
  .segmented { margin:16px 20px 0; display:flex; gap:6px; background:var(--n100); padding:4px; border-radius:var(--r-control); }
  .segmented button { flex:1; height:36px; border:0; background:transparent; border-radius:14px; font:500 14px/20px var(--sans); color:var(--n600); cursor:pointer; transition:background .18s var(--ease-out),color .18s var(--ease-out); }
  .segmented button[aria-selected="true"] { background:var(--n0); color:var(--n800); box-shadow:var(--card-shadow); }

  /* 话题 chip：与平台筛选同一排的第二排（真实页面的做法） */
  .topics { margin:12px 0 0; padding:0 20px 4px; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; }
  .topics::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; height:32px; padding:0 12px; border:1px solid var(--n200); background:var(--n0); border-radius:999px; font:400 12px/17px var(--sans); color:var(--n600); cursor:pointer; transition:border-color .18s var(--ease-out),background .18s var(--ease-out),color .18s var(--ease-out); }
  .chip:hover { border-color:var(--brand-300); }
  .chip[aria-pressed="true"] { background:var(--brand-100); border-color:var(--brand-300); color:var(--brand-700); font-weight:500; }
  .chip .count { color:var(--n400); margin-left:6px; }
  .chip[aria-pressed="true"] .count { color:var(--brand-600); }

  /* ---------------- 卡片 ---------------- */
  .feed { padding:12px 20px 0; display:flex; flex-direction:column; gap:12px; }
  .card { position:relative; background:var(--n0); border:1px solid var(--n200); border-radius:var(--r-card); padding:16px; box-shadow:var(--card-shadow); overflow:hidden; }

  /* 角色出场：淡入 + 上移 8px，240ms，柔和 ease-out；逐张 60ms 错开 */
  .card { opacity:0; transform:translateY(8px); animation:card-in .24s var(--ease-out) forwards; }
  .card:nth-child(1){animation-delay:0s} .card:nth-child(2){animation-delay:.06s} .card:nth-child(3){animation-delay:.12s}
  @keyframes card-in { to { opacity:1; transform:none; } }

  .who { display:flex; align-items:center; gap:10px; }
  .avatar-wrap { position:relative; width:44px; height:44px; flex:0 0 44px; }

  /* 角色光晕：头像后面的品牌 → 社交层的柔光，缓慢“呼吸” */
  .bloom { position:absolute; inset:-6px; border-radius:999px;
    background:radial-gradient(60% 60% at 50% 55%, rgba(59,130,246,.20) 0%, rgba(124,108,229,.14) 45%, rgba(124,108,229,0) 72%);
    animation:breathe 3.6s ease-in-out infinite alternate; }
  @keyframes breathe { from { transform:scale(.94); opacity:.75 } to { transform:scale(1.06); opacity:1 } }

  /* 角色在位的持续微动（“活着”的感觉）：只动 1.5px，3.2s */
  .avatar { position:relative; width:44px; height:44px; border-radius:999px; overflow:hidden; border:1px solid var(--n200); background:linear-gradient(180deg,var(--brand-100),var(--accent-100)); display:grid; place-items:center;
    animation:idle-bob 3.2s ease-in-out infinite alternate; }
  @keyframes idle-bob { from { transform:translateY(0) } to { transform:translateY(-1.5px) } }
  .avatar svg { display:block; }
  /* 真实上线时这里换成角色立绘/用户头像：同一个框、同一套动效 */
  .avatar img { width:100%; height:100%; object-fit:cover; }

  .name { font:500 14px/20px var(--sans); }
  .meta { font:400 12px/17px var(--sans); color:var(--n500); display:flex; align-items:center; gap:6px; margin-top:2px; }
  .dot { width:6px; height:6px; border-radius:999px; background:var(--success-500); animation:pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }

  .body-text { margin:12px 0 0; font:400 15px/23px var(--sans); }
  .tags { margin:10px 0 0; display:flex; flex-wrap:wrap; gap:6px; }
  .tag { font:400 11px/15px var(--sans); color:var(--brand-700); background:var(--brand-50); border-radius:999px; padding:3px 9px; }

  /* 互动排：图标是描边 SVG，不用 emoji */
  .actions { margin:14px 0 0; display:flex; align-items:center; gap:4px; }
  .act { display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 10px; border:0; background:transparent; border-radius:14px; font:400 12px/17px var(--sans); color:var(--n500); cursor:pointer; transition:background .12s var(--ease-out),color .12s var(--ease-out); }
  .act:hover { background:var(--n100); color:var(--n800); }
  .act:focus-visible { outline:2px solid var(--brand-500); outline-offset:2px; }
  .act svg { width:19px; height:19px; }
  .act[aria-pressed="true"] { color:var(--brand-700); }
  .act[aria-pressed="true"] .heart-fill { fill:var(--brand-500); stroke:var(--brand-500); }
  .act.saved[aria-pressed="true"] { color:var(--accent-600); }
  .act.saved[aria-pressed="true"] .bm-fill { fill:var(--accent-500); stroke:var(--accent-500); }

  /* 反应时的“绽放”：图标放大 1.18 后回到原位，180ms；无回弹 */
  .pop { animation:pop .18s var(--ease-out); }
  @keyframes pop { 50% { transform:scale(1.18) } }

  /* 角色回应：从图标位置扩散一圈很淡的光环，320ms 后消失（不是永久装饰） */
  .spark { position:absolute; width:18px; height:18px; border-radius:999px; border:2px solid var(--brand-300); pointer-events:none; animation:spark .32s var(--ease-out) forwards; }
  .spark.accent { border-color:var(--accent-300); }
  @keyframes spark { from { transform:scale(.4); opacity:.9 } to { transform:scale(2.6); opacity:0 } }

  /* 发布入口：沿用产品里已有的“气泡”语言（Discover 气泡墙的同一套动作） */
  .compose { position:sticky; bottom:12px; margin:16px 20px 0; display:flex; align-items:center; gap:10px; background:var(--n0); border:1px solid var(--n200); border-radius:var(--r-row); padding:10px 12px; box-shadow:0 4px 14px rgba(23,32,51,.08); }
  .compose .bubble { width:34px; height:34px; border-radius:999px 999px 999px 8px; background:linear-gradient(180deg,var(--brand-500),var(--brand-600)); display:grid; place-items:center; animation:float 3.4s ease-in-out infinite alternate; }
  @keyframes float { from { transform:translateY(0) } to { transform:translateY(-3px) } }
  .compose .hint { flex:1; font:400 14px/20px var(--sans); color:var(--n500); }
  .compose .go { height:36px; padding:0 14px; border:0; border-radius:14px; background:var(--brand-600); color:#fff; font:500 14px/20px var(--sans); cursor:pointer; }
  .compose .go:focus-visible { outline:2px solid var(--brand-700); outline-offset:2px; }

  .note { margin:14px 20px 0; padding:10px 12px; border-radius:var(--r-row); background:var(--accent-50); color:var(--n600); font:400 12px/17px var(--sans); }
  .note b { color:var(--n800); font-weight:600; }

  /* 尊重系统的减弱动效设置：全部关掉，只留状态本身 */
  @media (prefers-reduced-motion: reduce) {
    .card, .bloom, .avatar, .dot, .compose .bubble { animation:none !important; opacity:1 !important; transform:none !important; }
    .spark { display:none; }
    * { transition-duration:.01ms !important; }
  }
</style>
</head>
<body>
<main class="shell" data-kun-component-root>
  <header>
    <div class="row">
      <h1>动态</h1>
      <div class="row" style="gap:0">
        <button class="icon-btn" aria-label="动态设置" title="动态设置">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#68738A" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 13.6H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.7 7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 20.9 10H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <button class="icon-btn" aria-label="发布动态" title="发布动态">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </div>

    <div class="segmented" role="tablist" aria-label="动态视图">
      <button role="tab" aria-selected="true">动态分类</button>
      <button role="tab" aria-selected="false">收藏</button>
    </div>

    <div class="topics" aria-label="话题筛选">
      <button class="chip" aria-pressed="true">全部话题</button>
      <button class="chip" aria-pressed="false">旅行<span class="count">12</span></button>
      <button class="chip" aria-pressed="false">日剧<span class="count">8</span></button>
      <button class="chip" aria-pressed="false">交换语言<span class="count">5</span></button>
    </div>
  </header>

  <section class="feed">
    <article class="card">
      <div class="who">
        <div class="avatar-wrap">
          <span class="bloom" aria-hidden="true"></span>
          <span class="avatar" aria-hidden="true">
            <svg width="30" height="30" viewBox="0 0 32 32" role="img" aria-label="角色头像占位">
              <circle cx="16" cy="12.5" r="6.2" fill="#172033" opacity=".82"/>
              <path d="M20.6 7.2c2.3.7 3.4 2.6 3 4.6-.3 1.4-1.3 2.2-2.6 2.4" fill="none" stroke="#172033" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M4.6 30c1.4-5.4 5.8-8.2 11.4-8.2S26 24.6 27.4 30z" fill="#172033" opacity=".82"/>
            </svg>
          </span>
        </div>
        <div>
          <div class="name">みなと</div>
          <div class="meta"><span class="dot" aria-hidden="true"></span>在线 · 正在学中文</div>
        </div>
      </div>

      <p class="body-text">今天在京都的鸭川边坐了一下午，遇到一位从成都来的旅行者，我们用各自半生不熟的语言聊了两个小时。</p>
      <div class="tags"><span class="tag">#旅行</span><span class="tag">#交换语言</span></div>

      <div class="actions">
        <button class="act" aria-pressed="false" data-react="like">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path class="heart-fill" d="M12 20s-7-4.6-7-9.4A4.1 4.1 0 0 1 12 7.7a4.1 4.1 0 0 1 7 2.9C19 15.4 12 20 12 20z"/></svg>
          <span>24</span>
        </button>
        <button class="act" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 20 12z"/></svg>
          <span>6</span>
        </button>
        <button class="act saved" aria-pressed="false" data-react="save">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path class="bm-fill" d="M7 4h10a1 1 0 0 1 1 1v15l-6-3.6L6 20V5a1 1 0 0 1 1-1z"/></svg>
          <span>收藏</span>
        </button>
      </div>
    </article>

    <article class="card">
      <div class="who">
        <div class="avatar-wrap">
          <span class="bloom" aria-hidden="true"></span>
          <span class="avatar" aria-hidden="true">
            <svg width="30" height="30" viewBox="0 0 32 32" role="img" aria-label="角色头像占位">
              <circle cx="16" cy="12.5" r="6.2" fill="#172033" opacity=".82"/>
              <path d="M9.6 8.4C7.2 9.4 6.4 12 7.4 14.2" fill="none" stroke="#172033" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M4.6 30c1.4-5.4 5.8-8.2 11.4-8.2S26 24.6 27.4 30z" fill="#172033" opacity=".82"/>
            </svg>
          </span>
        </div>
        <div>
          <div class="name">林可</div>
          <div class="meta"><span class="dot" aria-hidden="true"></span>在线 · 想找人练日语</div>
        </div>
      </div>

      <p class="body-text">第一次用「交换联系方式」约到今天这顿午饭。我们约在车站旁的咖啡馆，先聊了半小时才开始互相纠音——原来最难的从来不是语法，是开口。</p>
      <div class="tags"><span class="tag">#交换语言</span></div>

      <div class="actions">
        <button class="act" aria-pressed="false" data-react="like">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path class="heart-fill" d="M12 20s-7-4.6-7-9.4A4.1 4.1 0 0 1 12 7.7a4.1 4.1 0 0 1 7 2.9C19 15.4 12 20 12 20z"/></svg>
          <span>51</span>
        </button>
        <button class="act" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 20 12z"/></svg>
          <span>18</span>
        </button>
        <button class="act saved" aria-pressed="false" data-react="save">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path class="bm-fill" d="M7 4h10a1 1 0 0 1 1 1v15l-6-3.6L6 20V5a1 1 0 0 1 1-1z"/></svg>
          <span>收藏</span>
        </button>
      </div>
    </article>
  </section>

  <div class="compose">
    <span class="bubble" aria-hidden="true">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="#fff"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
    </span>
    <span class="hint">分享你今天想说的话…</span>
    <button class="go">发布</button>
  </div>

  <p class="note">
    <b>这是动效原型，不是最终界面。</b>角色立绘/头像会落进同一个圆框里（<code>.avatar</code>），
    框与动效不变。已关闭系统动效（<code>prefers-reduced-motion</code>）的分支也做了；
    对比度按 AA 取值（正文 15.4:1、次要 4.76:1）。
  </p>
</main>

<script>
  // 分段、话题 chip：只做状态切换，不做数据请求（原型）
  document.querySelectorAll('.segmented button').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.segmented button').forEach((b) => b.setAttribute('aria-selected', String(b === btn)));
    });
  });
  document.querySelectorAll('.chip').forEach((chip) => {
    chip.addEventListener('click', () => {
      if (chip.textContent.trim().startsWith('全部')) return;
      document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c === chip)));
    });
  });

  // 互动：按下 → 图标轻微“绽放” + 从图标位置扩散一圈柔光（无回弹）
  document.querySelectorAll('.act[data-react]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const on = btn.getAttribute('aria-pressed') === 'true';
      btn.setAttribute('aria-pressed', String(!on));

      const icon = btn.querySelector('svg');
      icon.classList.remove('pop');
      void icon.offsetWidth;            // 重启动画
      icon.classList.add('pop');

      const spark = document.createElement('span');
      spark.className = 'spark' + (btn.dataset.react === 'save' ? ' accent' : '');
      const rect = icon.getBoundingClientRect();
      const host = btn.getBoundingClientRect();
      spark.style.left = (rect.left - host.left + rect.width / 2 - 9) + 'px';
      spark.style.top = (rect.top - host.top + rect.height / 2 - 9) + 'px';
      btn.appendChild(spark);
      setTimeout(() => spark.remove(), 340);
    });
  });
</script>
</body>
</html>
